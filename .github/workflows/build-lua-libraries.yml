name: Build Lua libraries

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-lua-libraries.yml'
      - 'Documentation/BuildingBinaries/**'
  pull_request:
    paths:
      - '.github/workflows/build-lua-libraries.yml'
      - 'Documentation/BuildingBinaries/**'

permissions:
  contents: read

env:
  OPENSSL_RELEASE_TAG: 'publish/4.1.0-1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Build Lua 5.1.5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $luaRoot = 'C:\lua\5.1.5\x86_64'
          $luaArchive = Join-Path $env:RUNNER_TEMP 'lua-5.1.5.tar.gz'
          New-Item -ItemType Directory -Force -Path $luaRoot | Out-Null
          Invoke-WebRequest -Uri 'https://www.lua.org/ftp/lua-5.1.5.tar.gz' -OutFile $luaArchive
          tar.exe -xzf $luaArchive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) {
            throw "Lua source extraction failed with exit code $LASTEXITCODE."
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'lua-5.1.5\*') $luaRoot -Recurse -Force
          Copy-Item 'Documentation/BuildingBinaries/luavs-dcs.bat' (Join-Path $luaRoot 'etc\lua-dcs.bat') -Force
          $buildCommand = 'cd /d "{0}" && etc\lua-dcs.bat' -f $luaRoot
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Lua build failed with exit code $LASTEXITCODE."
          }
          foreach ($file in @('lua.exe', 'lua.dll', 'lua.lib')) {
            if (-not (Test-Path (Join-Path $luaRoot "src\$file"))) {
              throw "Lua build did not produce src\$file."
            }
          }
          Copy-Item (Join-Path $luaRoot 'src\lua.lib') (Join-Path $luaRoot 'src\lua51.lib') -Force

      - name: Install OpenSSL
        id: install_openssl
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OPENSSL_RELEASE_TAG -notmatch '^publish/(?<version>\d+\.\d+\.\d+)-\d+$') {
            throw "Unexpected OpenSSL release tag format: $env:OPENSSL_RELEASE_TAG"
          }
          $opensslVersion = $Matches.version
          $opensslInstallVersion = $opensslVersion -replace '\.\d+$', ''
          $opensslInstallDir = "C:\Program Files\OpenSSL Library\openssl-$opensslInstallVersion"
          "version=$opensslVersion" >> $env:GITHUB_OUTPUT
          "install_dir=$opensslInstallDir" >> $env:GITHUB_OUTPUT
          $installerName = "OpenSSL-x64-VS-$opensslVersion.msi"
          $installer = Join-Path $env:RUNNER_TEMP $installerName
          $downloadUrl = "https://github.com/openssl/installer/releases/download/$env:OPENSSL_RELEASE_TAG/$installerName"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
          $arguments = @('/i', $installer, '/qn', '/norestart', 'INSTALL_SDK=1', 'INSTALL_APPS=0', 'ADJUSTSYSTEMPATHENV=0')
          $process = Start-Process -FilePath 'msiexec.exe' -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "OpenSSL installation failed with exit code $($process.ExitCode)."
          }
          foreach ($file in @('include\openssl\ssl.h', 'lib\libssl_static.lib', 'lib\libcrypto_static.lib')) {
            if (-not (Test-Path (Join-Path $opensslInstallDir $file))) {
              throw "OpenSSL installation did not provide $file under $opensslInstallDir."
            }
          }

      - name: Install LuaRocks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'luarocks.zip'
          $luaBin = 'C:\lua\5.1.5\x86_64\src'
          Invoke-WebRequest -Uri 'https://luarocks.github.io/luarocks/releases/luarocks-3.13.0-windows-64.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'luarocks-3.13.0-windows-64\*.exe') $luaBin -Force
          if (-not (Test-Path (Join-Path $luaBin 'luarocks.exe'))) {
            throw "LuaRocks was not installed in $luaBin."
          }
          $configRoot = Join-Path $env:APPDATA 'luarocks'
          New-Item -ItemType Directory -Force -Path $configRoot | Out-Null
          Copy-Item 'Documentation/BuildingBinaries/config-5.1.lua' (Join-Path $configRoot 'config-5.1.lua') -Force

      - name: Build LuaSocket and LuaSec
        shell: pwsh
        env:
          OPENSSL_INSTALL_DIR: ${{ steps.install_openssl.outputs.install_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $luaRocks = 'C:\lua\5.1.5\x86_64\src\luarocks.exe'
          $rocksTree = Join-Path $env:RUNNER_TEMP 'rocks'
          $opensslRoot = $env:OPENSSL_INSTALL_DIR
          & $luaRocks --lua-version=5.1 "--tree=$rocksTree" install luasocket 3.1.0-1
          if ($LASTEXITCODE -ne 0) {
            throw "LuaSocket build failed with exit code $LASTEXITCODE."
          }
          $luasecRoot = Join-Path $env:RUNNER_TEMP 'luasec'
          git clone --depth 1 --branch v1.3.2 https://github.com/lunarmodules/luasec.git $luasecRoot
          if ($LASTEXITCODE -ne 0) {
            throw "LuaSec checkout failed with exit code $LASTEXITCODE."
          }
          Copy-Item 'Documentation/BuildingBinaries/luasec-1.3.2-2.rockspec' $luasecRoot -Force
          Push-Location $luasecRoot
          try {
            & $luaRocks --lua-version=5.1 "--tree=$rocksTree" make 'luasec-1.3.2-2.rockspec' "OPENSSL_DIR=$opensslRoot" --force
            if ($LASTEXITCODE -ne 0) {
              throw "LuaSec build failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

      - name: Display C:\lua tree on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path 'C:\lua') {
            tree.com 'C:\lua' /F
          }
          else {
            Write-Host 'C:\lua does not exist.'
          }

      - name: Stage library DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rocksRoot = Join-Path $env:RUNNER_TEMP 'rocks\lib\lua\5.1'
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'build\lua-libraries\ssl\dll'
          $libraries = @{
            'mime\core.dll' = 'mime\core.dll'
            'socket\core.dll' = 'socket\core.dll'
            'ssl.dll' = 'ssl.dll'
          }
          foreach ($library in $libraries.GetEnumerator()) {
            $source = Join-Path $rocksRoot $library.Key
            if (-not (Test-Path $source)) {
              throw "Expected library DLL was not produced: $source"
            }
            $destination = Join-Path $outputRoot $library.Value
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            Copy-Item $source $destination -Force
          }

      - name: Upload Lua library DLLs
        uses: actions/upload-artifact@v7
        with:
          name: lua-libraries-windows-x64
          path: build/lua-libraries
          if-no-files-found: error
